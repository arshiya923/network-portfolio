<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 15 15">
  <defs>
    <pattern id="abstractPattern" patternUnits="userSpaceOnUse" width="15" height="15">
      <!-- نقطه‌ی مرکزی -->
      <circle cx="7.5" cy="7.5" r="1" fill="#00ff99ba" opacity="0.8" />
      <!-- خطوط مورب -->
      <path d="M0 0L15 15M15 0L0 15" stroke="#00ff99ba" stroke-width="0.5" opacity="0.2" />
      <!-- دایره‌های کناری برای حس شبکه -->
      <circle cx="3" cy="3" r="0.6" fill="#00ff99ba" opacity="0.5" />
      <circle cx="12" cy="12" r="0.6" fill="#00ff99ba" opacity="0.5" />
      <circle cx="3" cy="12" r="0.4" fill="#00ff99ba" opacity="0.4" />
      <circle cx="12" cy="3" r="0.4" fill="#00ff99ba" opacity="0.4" />
    </pattern>
  </defs>

  <!-- ناحیه‌ی تست -->
  <rect width="100%" height="100%" fill="url(#abstractPattern)" />
</svg>
